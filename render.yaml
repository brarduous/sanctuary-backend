services:
  - type: cron
    name: sanctuary-church-content-dispatch
    runtime: node
    plan: starter
    region: oregon
    schedule: "*/5 * * * *"
    buildCommand: npm install
    startCommand: npm run cron-church-content
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
  - type: cron
    name: sanctuary-general-devotionals-daily
    runtime: node
    plan: starter
    region: oregon
    schedule: "0 8 * * *"
    buildCommand: npm install
    startCommand: npm run cron-general-devotionals
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GENERAL_DEVOTIONAL_RUNWAY_DAYS
        value: 28
      - key: GENERAL_DEVOTIONAL_MAX_WEEKS_PER_RUN
        value: 2
